name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: slacker
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/slacker
            git pull origin main
            npm install
            sudo systemctl restart slacker
